<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b7e4c7" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>

  <!-- Subtle circles for depth -->
  <circle cx="120" cy="100" r="140" fill="rgba(255,255,255,0.03)"/>
  <circle cx="700" cy="380" r="180" fill="rgba(255,255,255,0.04)"/>

  <!-- Centered Icon Card -->
  <g transform="translate(400, 210)">
    <!-- Outer glow pill -->
    <rect x="-85" y="-75" width="170" height="150" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
    <!-- Inner Icon Box -->
    <rect x="-55" y="-45" width="110" height="90" rx="18" fill="url(#badgeGrad)"/>
    
    <!-- Store / Hanger Icon -->
    <g transform="translate(0, 0)" fill="#1b4332">
      <!-- Store icon -->
      <path d="M -24 -15 L 24 -15 L 28 5 L -28 5 Z" fill="#2d6a4f"/>
      <path d="M -22 5 L -22 22 L 22 22 L 22 5" stroke="#1b4332" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M -7 22 L -7 11 L 7 11 L 7 22" fill="#1b4332"/>
      <circle cx="-16" cy="5" r="4" fill="#52b788"/>
      <circle cx="0" cy="5" r="4" fill="#52b788"/>
      <circle cx="16" cy="5" r="4" fill="#52b788"/>
    </g>
  </g>

  <!-- Text -->
  <text x="400" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    ThriftMap Boutique
  </text>
  <text x="400" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(216, 243, 220, 0.85)" letter-spacing="1">
    CURATED SECONDHAND &amp; VINTAGE
  </text>
</svg>
